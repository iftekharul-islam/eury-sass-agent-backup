[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/agent-types",
  "crates/agent-sandbox",
  "crates/agent-policy",
  "crates/agent-store",
  "crates/agent-index",
  "crates/agent-memory",
  "crates/agent-tools",
  "crates/agent-core", "eval",
  "crates/agent-sandbox-probe",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
authors = ["Eury Engineering"]
repository = "https://github.com/eury/eury-agent"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"
disallowed_methods = "deny"
