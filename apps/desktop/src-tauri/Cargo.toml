[package]
name = "eury-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "eury_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-core = { version = "0.1.0", path = "../../../crates/agent-core" }
agent-sandbox = { version = "0.1.0", path = "../../../crates/agent-sandbox" }
agent-store = { version = "0.1.0", path = "../../../crates/agent-store" }
agent-types = { version = "0.1.0", path = "../../../crates/agent-types" }
dotenvy = "0.15"
ignore = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
uuid = { version = "1.24.1", features = ["v5", "v7"] }

[lints]
workspace = true
