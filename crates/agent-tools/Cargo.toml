[package]
name = "agent-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agent-types = { path = "../agent-types" }
agent-sandbox = { path = "../agent-sandbox" }
async-trait = "0.1.92"
serde = { version = "1.0", features = ["derive"] }
