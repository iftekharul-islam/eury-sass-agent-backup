[package]
name = "agent-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agent-types = { path = "../agent-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.24", features = ["v7", "serde"] }
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4.45"
sha2 = "0.11.0"
hex = "0.4.3"
globset = "0.4.20"
regex = "1.13.1"
agent-sandbox = { version = "0.1.0", path = "../agent-sandbox" }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
