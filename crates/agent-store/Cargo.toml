[package]
name = "agent-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
hex = "0.4.3"
keyring = "4.1.6"
rand = "0.10.2"
rand_chacha = "0.10.0"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
uuid = { version = "1.24.1", features = ["v7"] }
