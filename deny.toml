# cargo-deny configuration for Eury Agent workspace

[graph]
targets = [
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
# Transitive via cersei → reqwest 0.12 → hickory-resolver 0.25.
# No compatible upgrade until cersei moves off reqwest 0.12.
ignore = [
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25 NSEC3 loop; unused DNSSEC path via cersei reqwest 0.12" },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25 name-compression DoS; unused DNSSEC path via cersei reqwest 0.12" },
]

[licenses]
version = 2
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.8
exceptions = []

[bans]
version = 2
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
