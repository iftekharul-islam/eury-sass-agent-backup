title = "Eury Agent gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Allowed paths and patterns for test fixtures and documentation examples"
paths = [
  '''tests/fixtures/security/.*''',
  '''agent/tests/fixtures/security/.*''',
  '''scripts/check-.*\.mjs''',
]
regexes = [
  '''(?i)example[_-]?key''',
  '''(?i)test[_-]?token''',
  '''sk-ant-api03-[A-Za-z0-9_-]{20}\.\.\.''',
  '''sk-[A-Za-z0-9]{20}\.\.\.''',
]
